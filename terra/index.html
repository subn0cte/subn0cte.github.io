<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Seven</title>
    <style>
        /* Сбрасываем отступы у body и html */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Убираем полосы прокрутки у самой страницы */
            background-color: #000; /* Цвет фона на случай загрузки */
        }

        /* Настраиваем iframe на весь экран */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none; /* Убираем рамку */
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://terra-seven-tawny.vercel.app/" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
    </iframe>

</body>
</html>
